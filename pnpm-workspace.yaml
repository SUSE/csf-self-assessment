packages:
  - 'packages/*'
  - 'apps/*'

# esbuild (via Vite) needs its install script to set up the native binary.
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@lucide/svelte@1.28.0'

overrides:
  "minimatch@3>brace-expansion": ">=1.1.18 <2"
  "minimatch@10>brace-expansion": ">=5.0.9 <6"
  "js-yaml": ">=4.3.2"
  "nanoid": ">=3.3.18"
  "vitest": ">=4.1.11"
  "@vitest/mocker": ">=4.1.11"
