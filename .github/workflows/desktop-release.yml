name: Desktop prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  source:
    name: Gate and verify source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gate.outputs.version }}
      disposition: ${{ steps.gate.outputs.disposition }}
      trust: ${{ steps.gate.outputs.trust }}
      native_matrix: ${{ steps.gate.outputs.native_matrix }}
      clean_matrix: ${{ steps.gate.outputs.clean_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require commit in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Gate release source
        id: gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_READINESS: ${{ vars.DESKTOP_RELEASE_SIGNING_READY || 'false' }}
        run: pnpm --filter @csf/desktop run release:gate "$RELEASE_TAG" "$RELEASE_READINESS" "$GITHUB_OUTPUT"
      - name: Verify source
        run: xvfb-run --auto-servernum pnpm verify
      - name: Stage renderer bytes
        run: |
          mkdir -p dist/release-renderers
          cp apps/author/dist/author.html dist/release-renderers/author.html
          cp apps/assessment/dist/assessment.html dist/release-renderers/assessment.html
      - name: Upload renderer bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-renderers-${{ steps.gate.outputs.version }}
          path: dist/release-renderers
          retention-days: 14
          if-no-files-found: error

  native:
    name: Native ${{ matrix.system }}
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.native_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download renderer bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-renderers-${{ needs.source.outputs.version }}
          path: dist/release-renderers
      - name: Restore renderer build paths
        shell: bash
        run: |
          mkdir -p apps/author/dist apps/assessment/dist
          cp dist/release-renderers/author.html apps/author/dist/author.html
          cp dist/release-renderers/assessment.html apps/assessment/dist/assessment.html
      - name: Build unsigned native packages
        if: ${{ needs.source.outputs.trust == 'unsigned-candidate' && matrix.system != 'linux' }}
        run: pnpm --filter @csf/desktop run release:native "${{ matrix.system }}" "${{ needs.source.outputs.trust }}"
      - name: Build unsigned Linux packages
        if: ${{ needs.source.outputs.trust == 'unsigned-candidate' && matrix.system == 'linux' }}
        run: xvfb-run --auto-servernum pnpm --filter @csf/desktop run release:native "${{ matrix.system }}" "${{ needs.source.outputs.trust }}"
      - name: Build signed Mac packages
        if: ${{ needs.source.outputs.trust == 'signed-candidate' && matrix.system == 'macos' }}
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @csf/desktop run release:native "${{ matrix.system }}" "${{ needs.source.outputs.trust }}"
      - name: Build signed Windows packages
        if: ${{ needs.source.outputs.trust == 'signed-candidate' && matrix.system == 'windows' }}
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm --filter @csf/desktop run release:native "${{ matrix.system }}" "${{ needs.source.outputs.trust }}"
      - name: Build signed Linux packages
        if: ${{ needs.source.outputs.trust == 'signed-candidate' && matrix.system == 'linux' }}
        run: xvfb-run --auto-servernum pnpm --filter @csf/desktop run release:native "${{ matrix.system }}" "${{ needs.source.outputs.trust }}"
      - name: Upload failure log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-native-log-${{ matrix.system }}-${{ needs.source.outputs.version }}
          path: apps/desktop/dist/release-logs
          retention-days: 14
          if-no-files-found: warn
      - name: Upload native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-packages-${{ matrix.system }}-${{ needs.source.outputs.version }}
          path: dist/release-stage/${{ matrix.system }}
          retention-days: 14
          if-no-files-found: error

  assemble:
    name: Assemble complete candidate
    needs: [source, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download renderer bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-renderers-${{ needs.source.outputs.version }}
          path: dist/candidate-input
      - name: Download Mac packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-packages-macos-${{ needs.source.outputs.version }}
          path: dist/candidate-input
      - name: Download Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-packages-windows-${{ needs.source.outputs.version }}
          path: dist/candidate-input
      - name: Download Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-packages-linux-${{ needs.source.outputs.version }}
          path: dist/candidate-input
      - name: Assemble and verify candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NODE_VERSION="$(node --version)"
          pnpm --filter @csf/desktop run release:assemble ../../dist/candidate-input ../../dist/desktop-candidate "$RELEASE_TAG" "$GITHUB_SHA" "${NODE_VERSION#v}"
      - name: Upload complete candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-candidate-${{ needs.source.outputs.version }}
          path: dist/desktop-candidate
          retention-days: 14
          if-no-files-found: error

  clean_native:
    name: Clean ${{ matrix.lane }}
    needs: [source, assemble]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.clean_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-candidate-${{ needs.source.outputs.version }}
          path: dist/desktop-candidate
      - name: Launch exact native packages
        if: ${{ matrix.system != 'linux' }}
        run: pnpm --filter @csf/desktop run release:clean-host "${{ matrix.lane }}" "${{ needs.source.outputs.trust }}" "../../dist/desktop-candidate"
      - name: Launch exact Linux packages
        if: ${{ matrix.system == 'linux' }}
        run: xvfb-run --auto-servernum pnpm --filter @csf/desktop run release:clean-host "${{ matrix.lane }}" "${{ needs.source.outputs.trust }}" "../../dist/desktop-candidate"
      - name: Upload clean-host failure log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-clean-log-${{ matrix.lane }}-${{ needs.source.outputs.version }}
          path: apps/desktop/dist/release-logs/clean-${{ matrix.lane }}.log
          retention-days: 14
          if-no-files-found: warn

  clean_renderers:
    name: Open exact renderer files offline
    needs: [source, assemble]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-candidate-${{ needs.source.outputs.version }}
          path: dist/desktop-candidate
      - name: Verify exact candidate
        run: pnpm --filter @csf/desktop run release:verify ../../dist/desktop-candidate
      - name: Open both raw HTML files offline
        env:
          CSF_RELEASE_CANDIDATE_DIRECTORY: ../../dist/desktop-candidate
        run: pnpm --filter @csf/desktop run release:clean-renderers

  draft:
    name: Create hidden verified draft
    needs: [source, assemble, clean_native, clean_renderers]
    if: ${{ needs.source.outputs.disposition == 'publishable' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-candidate-${{ needs.source.outputs.version }}
          path: dist/desktop-candidate
      - name: Create and verify hidden draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @csf/desktop run release:publication draft ../../dist/desktop-candidate release/release-notes.md "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}"

  publish:
    name: Publish verified prerelease
    needs: [source, draft]
    if: ${{ needs.source.outputs.disposition == 'publishable' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-candidate-${{ needs.source.outputs.version }}
          path: dist/desktop-candidate
      - name: Publish exact verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @csf/desktop run release:publication publish ../../dist/desktop-candidate "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}"
